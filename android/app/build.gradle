apply plugin: 'com.android.application'

// Secrets remain outside Git. Environment variables allow Linux/CI builds;
// the existing Windows release.properties location remains compatible.
def signingProps = new Properties()
def propsPath = System.getenv('BIZNES_ANDROID_SIGNING_PROPERTIES')
def propsFile = propsPath ? file(propsPath) : file('release.properties')
if (!propsFile.exists() && System.getProperty('os.name').toLowerCase().contains('windows')) {
    propsFile = new File('C:/Users/User/bizneshasap-keys/release.properties')
}
if (propsFile.exists()) propsFile.withInputStream { signingProps.load(it) }
def signingValue = { key, envName -> System.getenv(envName) ?: signingProps.getProperty(key) }
def releaseStore = signingValue('storeFile', 'BIZNES_ANDROID_KEYSTORE')
def releaseStorePassword = signingValue('storePassword', 'BIZNES_ANDROID_STORE_PASSWORD')
def releaseAlias = signingValue('keyAlias', 'BIZNES_ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'BIZNES_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStore && releaseStorePassword && releaseAlias && releaseKeyPassword
// Never accidentally distribute an unsigned release when secrets are absent.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') } && !hasReleaseSigning) {
        throw new GradleException('Release signing is required. Configure the existing keystore outside Git.')
    }
}


android {
    namespace "com.bizneshasap.pos"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bizneshasap.pos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 32
        versionName "1.4.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
